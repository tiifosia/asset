name: Update MDD Data & Deploy to GitHub Pages

on:
  schedule:
    # Single-time POSIX cron entries (no comma lists) from 06:07 to 10:47 KST
    # Keeps >=12m spacing, avoids :00/:15/:30/:45 spikes, and exits in ~5s once synced.
    - cron: "7 21 * * *"  # 06:07 KST
    - cron: "19 21 * * *" # 06:19 KST
    - cron: "32 21 * * *" # 06:32 KST
    - cron: "44 21 * * *" # 06:44 KST
    - cron: "56 21 * * *" # 06:56 KST
    - cron: "8 22 * * *"  # 07:08 KST
    - cron: "23 22 * * *" # 07:23 KST
    - cron: "41 22 * * *" # 07:41 KST
    - cron: "3 23 * * *"  # 08:03 KST
    - cron: "23 23 * * *" # 08:23 KST
    - cron: "47 23 * * *" # 08:47 KST
    - cron: "13 0 * * *"  # 09:13 KST
    - cron: "43 0 * * *"  # 09:43 KST
    - cron: "17 1 * * *"  # 10:17 KST
    - cron: "47 1 * * *"  # 10:47 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "daily-data-sync"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if today's KST snapshot already synced
        id: freshness
        if: github.event_name == 'schedule'
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          cutoff_kst = now_kst.replace(hour=5, minute=30, second=0, microsecond=0)
          if now_kst < cutoff_kst:
              cutoff_kst -= timedelta(days=1)
          today_str = now_kst.strftime("%Y-%m-%d")

          def parse_utc_to_kst(ts: str):
              for fmt in ("%Y-%m-%d %H:%M:%S UTC", "%Y-%m-%d %H:%M UTC"):
                  try:
                      return datetime.strptime(ts.strip(), fmt).replace(tzinfo=timezone.utc).astimezone(KST)
                  except ValueError:
                      pass
              return None

          def check_all_fresh():
              pf_path = Path("public/data/portfolio.json")
              mdd_path = Path("public/data/mdd.json")
              macro_path = Path("public/data/macro.json")
              if not (pf_path.exists() and mdd_path.exists() and macro_path.exists()):
                  return False, "missing data file"

              pf = json.loads(pf_path.read_text(encoding="utf-8"))
              mdd = json.loads(mdd_path.read_text(encoding="utf-8"))
              macro = json.loads(macro_path.read_text(encoding="utf-8"))

              pf_dt = parse_utc_to_kst(pf.get("updated_at", ""))
              mdd_dt = parse_utc_to_kst(mdd.get("updated_at", ""))
              macro_dt = parse_utc_to_kst(macro.get("updated_at", ""))
              if not pf_dt or pf_dt < cutoff_kst:
                  return False, f"portfolio stale ({pf.get('updated_at')})"
              if not mdd_dt or mdd_dt < cutoff_kst:
                  return False, f"mdd stale ({mdd.get('updated_at')})"
              if not macro_dt or macro_dt < cutoff_kst:
                  return False, f"macro stale ({macro.get('updated_at')})"

              hist = pf.get("history") or []
              last_hist_date = hist[-1].get("date") if hist else None
              if last_hist_date != today_str:
                  return False, f"portfolio history last date={last_hist_date}, want={today_str}"

              providers = pf.get("providers") or {}
              for name, info in providers.items():
                  if isinstance(info, dict) and info.get("status") == "error":
                      return False, f"provider {name} in error state"

              return True, f"all datasets synced for {today_str}"

          try:
              fresh, reason = check_all_fresh()
          except Exception as exc:
              fresh, reason = False, f"check failed: {exc}"

          print(f"::notice::Freshness check -> skip={str(fresh).lower()} ({reason})")
          print(f"skip={'true' if fresh else 'false'}")
          PY

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.skip != 'true')
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.skip != 'true')
        run: pip install -r requirements.txt

      - name: Fetch daily market cap and MDD data
        id: fetch_mdd
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.skip != 'true')
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "fetch_mdd attempt $attempt..."
            if python scripts/fetch_mdd.py; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Fetch daily index valuation & macro sentiment data
        id: fetch_macro
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.skip != 'true')
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "fetch_macro attempt $attempt..."
            if python scripts/fetch_macro.py; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Fetch daily personal portfolio data
        id: fetch_portfolio
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.skip != 'true')
        continue-on-error: true
        env:
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          PORTFOLIO_PROXY_URL: ${{ secrets.PORTFOLIO_PROXY_URL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
        run: |
          for attempt in 1 2 3; do
            echo "fetch_portfolio attempt $attempt..."
            if python scripts/fetch_portfolio.py; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Commit updated data
        id: commit_data
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.skip != 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update daily portfolio and MDD data"
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git rebase --abort || true
              sleep 5
            done
            exit 1
          fi
          echo "pushed=false" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy for new data commit
        if: steps.freshness.outputs.skip != 'true' && steps.commit_data.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 2
          gh workflow run pages-deploy.yml --ref main

      - name: Fail if any data fetch step failed
        if: |
          (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.freshness.outputs.skip != 'true')) &&
          (steps.fetch_mdd.outcome == 'failure' || steps.fetch_macro.outcome == 'failure' || steps.fetch_portfolio.outcome == 'failure')
        run: |
          echo "One or more fetch steps failed: mdd=${{ steps.fetch_mdd.outcome }}, macro=${{ steps.fetch_macro.outcome }}, portfolio=${{ steps.fetch_portfolio.outcome }}"
          exit 1
